  <body>
    <script>
      // Apply saved theme immediately to prevent flash
      (function() {

        if (t) document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
